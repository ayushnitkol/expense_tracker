<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Expense Tracker</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#2563eb;
      --danger:#ef4444;
      --success:#10b981;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    body{
      margin:0;
      padding:32px;
      background:var(--bg);
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:900px;
      background:var(--card);
      border-radius:12px;
      padding:24px;
      box-shadow:0 6px 20px rgba(16,24,40,0.08);
    }

    h1{ margin:0 0 12px 0; font-size:20px; }
    form{ display:grid; gap:8px; grid-template-columns: 1fr 160px 120px; align-items:center; margin-bottom:16px; }
    label{ font-size:13px; color:var(--muted); }

    input[type="text"], input[type="number"], select {
      padding:8px 10px;
      border:1px solid #e6e9ee;
      border-radius:8px;
      outline:none;
      font-size:14px;
      width:100%;
    }
    input[type="number"]{ -moz-appearance:textfield; }

    button.primary {
      background:var(--accent);
      color:#fff;
      border:none;
      padding:10px 14px;
      border-radius:8px;
      cursor:pointer;
    }
    button.ghost {
      background:transparent;
      border:1px solid #e6e9ee;
      padding:8px 10px;
      border-radius:8px;
      cursor:pointer;
    }

    .summary {
      display:flex;
      gap:12px;
      align-items:center;
      margin-top:8px;
      flex-wrap:wrap;
    }

    .card {
      background:#fafbff;
      padding:12px;
      border-radius:8px;
      border:1px solid #eef2ff;
      font-size:14px;
    }

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:16px;
    }
    th, td {
      text-align:left;
      padding:10px 8px;
      border-bottom:1px solid #f1f4f8;
      font-size:14px;
    }
    th{ color:var(--muted); font-weight:600; font-size:13px; }
    td.amount{ font-weight:700; }

    .actions button {
      margin-right:6px;
      font-size:13px;
      padding:6px 8px;
      border-radius:6px;
      border: none;
      cursor:pointer;
    }
    .actions .edit{ background:#fde68a; }
    .actions .delete{ background:var(--danger); color:#fff; }

    @media (max-width:700px){
      form{ grid-template-columns: 1fr; }
      .summary{ flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <form id="expenseForm">
      <input type="text" id="description" placeholder="Description (e.g., Groceries)" required />
      <select id="category" required>
        <option value="">Select category</option>
        <option value="Food">Food</option>
        <option value="College Fees">College Fees</option>
        <option value="Transportation">Transportation</option>
        <option value="Others">Others</option>
      </select>
      <input type="number" id="amount" placeholder="Amount" min="0" step="0.01" required />
      <!-- submit button spans full width in smaller screens; JS handles form submit -->
      <div style="grid-column: span 3; display:flex; gap:8px; margin-top:6px;">
        <button type="submit" class="primary">Add / Save Expense</button>
        <button type="button" id="clearAll" class="ghost">Clear All</button>
      </div>
    </form>

    <div class="summary">
      <div class="card">Total: <strong id="totalAmount">₹0.00</strong></div>
      <div class="card">Food: <strong id="catFood">₹0.00</strong></div>
      <div class="card">College Fees: <strong id="catCollege">₹0.00</strong></div>
      <div class="card">Transportation: <strong id="catTransport">₹0.00</strong></div>
      <div class="card">Others: <strong id="catOthers">₹0.00</strong></div>
    </div>

    <table id="expenseTable" aria-label="Expense table">
      <thead>
        <tr>
          <th>#</th>
          <th>Description</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="expenseList"></tbody>
    </table>
  </div>

  <script>
    // Simple expense tracker with localStorage persistence
    const KEY = "my_expenses_v1";

    const expenseForm = document.getElementById("expenseForm");
    const descInput = document.getElementById("description");
    const catInput = document.getElementById("category");
    const amountInput = document.getElementById("amount");
    const expenseListEl = document.getElementById("expenseList");
    const clearAllBtn = document.getElementById("clearAll");

    const totalEl = document.getElementById("totalAmount");
    const catFoodEl = document.getElementById("catFood");
    const catCollegeEl = document.getElementById("catCollege");
    const catTransportEl = document.getElementById("catTransport");
    const catOthersEl = document.getElementById("catOthers");

    let expenses = [];
    let editIndex = -1; // -1 means not editing

    // load from localStorage
    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) expenses = JSON.parse(raw) || [];
      } catch (e) {
        expenses = [];
      }
      render();
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(expenses));
    }

    function formatCurrency(n) {
      // change to your local currency/format if needed
      return "₹" + Number(n).toFixed(2);
    }

    function render() {
      expenseListEl.innerHTML = "";
      let total = 0;
      const cats = { Food:0, "College Fees":0, Transportation:0, Others:0 };

      expenses.forEach((exp, i) => {
        total += Number(exp.amount);
        cats[exp.category] = (cats[exp.category] || 0) + Number(exp.amount);

        const tr = document.createElement("tr");

        const idxTd = document.createElement("td");
        idxTd.textContent = i + 1;

        const descTd = document.createElement("td");
        descTd.textContent = exp.description;

        const catTd = document.createElement("td");
        catTd.textContent = exp.category;

        const amountTd = document.createElement("td");
        amountTd.className = "amount";
        amountTd.textContent = formatCurrency(exp.amount);

        const actionsTd = document.createElement("td");
        actionsTd.className = "actions";

        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.className = "edit";
        editBtn.type = "button";
        editBtn.addEventListener("click", () => startEdit(i));

        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "delete";
        delBtn.type = "button";
        delBtn.addEventListener("click", () => removeExpense(i));

        actionsTd.appendChild(editBtn);
        actionsTd.appendChild(delBtn);

        tr.appendChild(idxTd);
        tr.appendChild(descTd);
        tr.appendChild(catTd);
        tr.appendChild(amountTd);
        tr.appendChild(actionsTd);

        expenseListEl.appendChild(tr);
      });

      totalEl.textContent = formatCurrency(total);
      catFoodEl.textContent = formatCurrency(cats.Food || 0);
      catCollegeEl.textContent = formatCurrency(cats["College Fees"] || 0);
      catTransportEl.textContent = formatCurrency(cats.Transportation || 0);
      catOthersEl.textContent = formatCurrency(cats.Others || 0);
    }

    function startEdit(index) {
      const exp = expenses[index];
      if (!exp) return;
      descInput.value = exp.description;
      catInput.value = exp.category;
      amountInput.value = exp.amount;
      editIndex = index;
      // focus description for quick edit
      descInput.focus();
    }

    function removeExpense(index) {
      if (!confirm("Delete this expense?")) return;
      expenses.splice(index, 1);
      save();
      render();
      // if we deleted the item being edited, reset edit mode
      if (editIndex === index) {
        editIndex = -1;
        expenseForm.reset();
      }
    }

    expenseForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const description = descInput.value.trim();
      const category = catInput.value;
      const amount = parseFloat(amountInput.value);

      if (!description || !category || isNaN(amount) || amount < 0) {
        alert("Please provide valid description, category and amount.");
        return;
      }

      const newExpense = { description, category, amount: amount.toFixed(2) };

      if (editIndex >= 0) {
        // save edit
        expenses[editIndex] = newExpense;
        editIndex = -1;
      } else {
        expenses.push(newExpense);
      }

      save();
      render();
      expenseForm.reset();
      descInput.focus();
    });

    clearAllBtn.addEventListener("click", () => {
      if (!expenses.length) return alert("No expenses to clear.");
      if (!confirm("Clear all expenses?")) return;
      expenses = [];
      save();
      render();
      expenseForm.reset();
      editIndex = -1;
    });

    // initialize
    load();
  </script>
</body>
</html>
